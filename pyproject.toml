[tool.poetry]
name = "fastapi-app"
version = "0.1.0"
description = "FastAPI marketplace app for Lab 5"
authors = ["Nazar Shyshuta shishutanazar@gmail.com"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = "^0.30.1"
pydantic = {extras = ["email"], version = "^2.7.4"}
pydantic-settings = "^2.3.3"
alembic = "^1.13.1"
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
pyjwt = "^2.8.0"
bcrypt = "^4.1.3"
python-multipart = "^0.0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"